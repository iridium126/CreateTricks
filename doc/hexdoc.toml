modid = "createmanaindustry"
book = "hexcasting:thehexbook"

resource_dirs = [  # top takes priority
    "resources",
    "{$_project.src}/main/resources",
    # excluded: {$_project.src}/generated/resources — datagen 输出的 en_ud 等彩蛋语言会让 hexdoc 的语言校验报错
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_createmanaindustry/_export/generated"

[template]
# TODO: change this to point to your actual mod icon
icon = "icon.png"
include = [
    "createmanaindustry",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "Createmanaindustry"
author = "iridium126"
show_landing_text = false

[textures]
# create/ars 等第三方模组的贴图未打包进 doc 资源时，缺失只警告不报错
strict = false
missing = "*"

[extra.hexcasting]
# regexes for parsing pattern registry files - if some or all of your patterns aren't being detected by hexdoc, this may need to be updated
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
_pattern_regex = { "!Raw"='register\("(?P<name>[a-zA-Z0-9_\/]+)",\s*\(\)\s*->\s*new\s+ActionRegistryEntry\(\s*HexPattern\.fromAngles\(\s*"(?P<signature>[aqweds]+)",\s*HexDir\.(?P<startdir>\w+)\)' }

[[extra.hexcasting.pattern_stubs]]
path = "{$_project.src}/main/java/com/iridium126/createmanaindustry/compat/hexcasting/CMIHexActions.java"
regex = "{^_pattern_regex}"

[[extra.hexcasting.pattern_stubs]]
path = "{$_project.src}/main/java/com/iridium126/createmanaindustry/compat/hexcasting/CMIHexTrickActions.java"
regex = "{^_pattern_regex}"

# source paths

[_project]
src = "../src"
