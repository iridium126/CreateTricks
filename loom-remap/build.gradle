plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version "1.15-SNAPSHOT"
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "loom-remap"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Resolve these once into local variables (same source as settings.gradle).
// Task closures invoked at execution time — e.g. Copy's `rename { }`, which
// runs the GString body as a transformer — cannot resolve project properties
// through their owner chain, but plain locals captured by the closure always
// can. Referencing `trickster_project_id` directly inside `rename { }` fails
// with MissingPropertyException exactly at that point.
def tricksterProjectId = providers.gradleProperty("trickster_project_id").get()
def tricksterFileId = providers.gradleProperty("trickster_file_id").get()
def fabricApiVersion = providers.gradleProperty("fabric_api_version").get()

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "curse.maven:trickster-${tricksterProjectId}:${tricksterFileId}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "io.vavr:vavr:0.10.4"
}

// Export into a stable dir outside build/ so the named jars survive `clean`
// and the root project can consume them without evaluating this subproject.
def exportedDir = layout.projectDirectory.dir("remapped-libs")
def exportedJar = layout.projectDirectory.file("remapped-libs/trickster-${tricksterProjectId}-${tricksterFileId}-named.jar")
def mergedFabricApiJar = layout.projectDirectory.file("remapped-libs/fabric-api-${fabricApiVersion}-named.jar")

tasks.register("exportTricksterNamedJar", Copy) {
    dependsOn configurations.compileClasspath

    from({
        def matches = configurations.compileClasspath.resolve().findAll {
            it.name.startsWith("trickster-") && it.name.endsWith(".jar")
        }
        if (matches.size() != 1) {
            throw new GradleException("Expected exactly one remapped Trickster jar on compileClasspath, found ${matches.size()}")
        }
        matches
    })

    into(exportedDir)
    rename { "trickster-${tricksterProjectId}-${tricksterFileId}-named.jar" }
}

// The fabric-api bundler jar does not include every module (e.g.
// fabric-transfer-api-v1 is a separate jar), so merge all remapped
// fabric-* jars into one artifact — same shape as namedTrickster.
tasks.register("mergeFabricApiNamedJar", Zip) {
    dependsOn configurations.compileClasspath
    inputs.files(configurations.compileClasspath)

    from({
        def matches = configurations.compileClasspath.resolve().findAll {
            it.name.endsWith(".jar") && !it.name.contains("-sources")
                && it.name.startsWith("fabric-") && !it.name.startsWith("fabric-loader")
        }
        if (matches.isEmpty()) {
            throw new GradleException("No remapped fabric-api jars found on compileClasspath")
        }
        matches.collect { zipTree(it) }
    })

    archiveFileName = "fabric-api-${fabricApiVersion}-named.jar"
    destinationDirectory = exportedDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    namedTrickster
    namedFabricApi
}

artifacts {
    add("namedTrickster", exportedJar.asFile) {
        builtBy tasks.named("exportTricksterNamedJar")
    }
    add("namedFabricApi", mergedFabricApiJar.asFile) {
        builtBy tasks.named("mergeFabricApiNamedJar")
    }
}

// This subproject exists solely to export remapped jars (Trickster, fabric-api)
// via artifact transforms during configuration resolution. Disable every
// lifecycle task so they never execute alongside root-project tasks.
gradle.taskGraph.whenReady { graph ->
    tasks.configureEach { task ->
        if (task.name != 'exportTricksterNamedJar' && task.name != 'mergeFabricApiNamedJar') {
            task.enabled = false
        }
    }
}
