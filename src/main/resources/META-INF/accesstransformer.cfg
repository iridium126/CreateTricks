# Strip final from the static vanilla uniform handle so the merged particle
# programs can seed a dummy ModelViewMat uniform (ShaderPackProgramCompiler
# .seedDummyModelViewUniform). Their Iris-generated shader JSON declares only
# iris_* matrices, so the vanilla handle stays null and ShaderInstance.apply()
# NPEs mid-upload, skipping ExtendedShader's remaining side effects. This is
# the same runtime assignment iris-flw-compat performs from its constructor.
public-f net.minecraft.client.renderer.ShaderInstance MODEL_VIEW_MATRIX

# The combat OPAQUE particle path samples the real vanilla lightmap in its
# vertex stage (textured.vsh uLightmap). LightTexture registers its
# DynamicTexture under a counter-suffixed path (dynamic/light_map_N) and keeps
# that ResourceLocation private, so make it readable to resolve the GL id.
public net.minecraft.client.renderer.LightTexture lightTextureLocation
